# ------------------------------------------------------------------------------
# FastUrl.API — Enterprise Production Redis Configuration (redis.conf)
# ------------------------------------------------------------------------------

# 1. MEMORY MANAGEMENT (LÁ CHẮN GIỚI HẠN BỘ NHỚ RAM)
# Giới hạn trần RAM tối đa 256MB để tránh OOM Killer
maxmemory 256mb

# Khi đầy RAM: Tự động xóa các key có cài TTL (EXPIRE) ít được dùng nhất
maxmemory-policy volatile-lru

# 2. PERSISTENCE (TỐI ƯU IOPS ĐĨA CỨNG CHO RATE LIMITING & CACHE)
# Tắt RDB Snapshot định kỳ để dành 100% tài nguyên CPU & IOPS cho API Throttling
save ""

# Tắt AOF (Append-Only File) vì dữ liệu Rate Limit là dữ liệu tạm thời (Ephemeral)
appendonly no

# 3. SECURITY & NETWORK
# Chỉ chấp nhận kết nối an toàn từ Docker Internal Network
protected-mode yes

# Chấp nhận kết nối trên cổng mặc định 6379
port 6379
